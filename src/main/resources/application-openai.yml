# OpenAI
# Needs: OPENAI_API_KEY  (https://platform.openai.com/api-keys)
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      chroma:
        collection-name: rag-docs-openai
